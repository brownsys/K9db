[package]
name = "memcached-memory"
version = "0.0.1"
edition = "2018"

[dependencies]
clap = "2.34.0"
memcached-rs = "0.4.2"
mysql = "20.1.0"
regex = "1"

[[bin]]
name = "memcached-memory"
path = "src/main.rs"

[package.metadata.raze]
workspace_path = "//cargo"
genmode = "Remote"

# The set of targets to generate BUILD rules for.
targets = [
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
